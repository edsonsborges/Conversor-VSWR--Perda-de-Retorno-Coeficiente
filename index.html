<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor RF - Datalink</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX no browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
          const [vswr, setVswr] = useState('1.50');
          const [returnLoss, setReturnLoss] = useState('');
          const [gamma, setGamma] = useState('');
          const [mismatchLoss, setMismatchLoss] = useState('');
          const [matchEfficiency, setMatchEfficiency] = useState('');
          const [status, setStatus] = useState({ text: '', color: '', bg: '' });

          const logoUrl = "https://afdatalink.com.br/wp-content/uploads/2017/08/logo_datalink.png";

          const calculateFromVswr = (val) => {
            const v = parseFloat(val);
            if (isNaN(v) || v < 1) return { rl: '', g: '', ml: '', eff: '' };
            if (v === 1) return { rl: '∞', g: '0.000', ml: '0.000', eff: '100.00' };
            
            const g = (v - 1) / (v + 1);
            const rl = -20 * Math.log10(g);
            const ml = -10 * Math.log10(1 - (g * g));
            const eff = (1 - (g * g)) * 100;
            
            return { 
              rl: rl.toFixed(2), 
              g: g.toFixed(3), 
              ml: ml.toFixed(3), 
              eff: eff.toFixed(2) 
            };
          };

          const calculateFromRl = (val) => {
            const rl = parseFloat(val);
            if (isNaN(rl) || rl < 0) return { vswr: '', g: '', ml: '', eff: '' };
            if (rl === 0) return { vswr: '∞', g: '1.000', ml: '∞', eff: '0.00' };
            
            const g = Math.pow(10, -rl / 20);
            const v = (1 + g) / (1 - g);
            const ml = -10 * Math.log10(1 - (g * g));
            const eff = (1 - (g * g)) * 100;
            
            return { 
              vswr: v.toFixed(3), 
              g: g.toFixed(3), 
              ml: ml.toFixed(3), 
              eff: eff.toFixed(2) 
            };
          };

          const evaluateMatch = (v) => {
            if (isNaN(v) || v < 1) return { text: 'Inválido', color: 'text-gray-500', bg: 'bg-gray-100' };
            if (v === 1) return { text: 'Perfeito (Ideal)', color: 'text-emerald-700', bg: 'bg-emerald-100' };
            if (v <= 1.2) return { text: 'Excelente', color: 'text-emerald-600', bg: 'bg-emerald-50' };
            if (v <= 1.5) return { text: 'Muito Bom', color: 'text-[#005a82]', bg: 'bg-blue-50' };
            if (v <= 2.0) return { text: 'Aceitável', color: 'text-yellow-600', bg: 'bg-yellow-50' };
            if (v <= 3.0) return { text: 'Marginal', color: 'text-orange-600', bg: 'bg-orange-50' };
            return { text: 'Mau (Alta Reflexão)', color: 'text-red-600', bg: 'bg-red-50' };
          };

          const handleVswrChange = (e) => {
            const val = e.target.value;
            setVswr(val);
            if (val === '') {
              setReturnLoss(''); setGamma(''); setMismatchLoss(''); setMatchEfficiency('');
              return;
            }
            const { rl, g, ml, eff } = calculateFromVswr(val);
            setReturnLoss(rl); setGamma(g); setMismatchLoss(ml); setMatchEfficiency(eff);
          };

          const handleRlChange = (e) => {
            const val = e.target.value;
            setReturnLoss(val);
            if (val === '') {
              setVswr(''); setGamma(''); setMismatchLoss(''); setMatchEfficiency('');
              return;
            }
            const { vswr: v, g, ml, eff } = calculateFromRl(val);
            setVswr(v); setGamma(g); setMismatchLoss(ml); setMatchEfficiency(eff);
          };

          useEffect(() => {
            const { rl, g, ml, eff } = calculateFromVswr(vswr);
            setReturnLoss(rl); setGamma(g); setMismatchLoss(ml); setMatchEfficiency(eff);
          }, []);

          useEffect(() => {
            setStatus(evaluateMatch(parseFloat(vswr)));
          }, [vswr]);

          return (
            <div className="min-h-screen flex flex-col justify-between">
              
              {/* Header */}
              <header className="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
                <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
                  <div className="flex items-center gap-4">
                    <a href="https://calculadoras.afdatalink.com.br" className="flex items-center">
                      <img 
                        src={logoUrl} 
                        alt="Datalink Calculadoras" 
                        className="h-10 sm:h-12 w-auto object-contain"
                        onError={(e) => {
                          e.target.onerror = null; 
                          e.target.src="https://afdatalink.com.br/wp-content/uploads/2021/04/logo-af-datalink.png";
                        }}
                      />
                    </a>
                    <div className="h-6 w-[1px] bg-slate-300 hidden sm:block"></div>
                    <span className="text-xs font-semibold text-slate-500 uppercase tracking-widest hidden sm:inline-block">
                      Central de Calculadoras
                    </span>
                  </div>

                  <nav className="flex items-center gap-2">
                    <span className="text-xs font-bold text-[#005a82] bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100 flex items-center gap-1.5">
                      Conversor RF
                    </span>
                  </nav>
                </div>
              </header>

              {/* Main */}
              <main className="max-w-4xl mx-auto w-full px-4 py-8 space-y-6 flex-grow">
                
                <div className="text-center sm:text-left space-y-1">
                  <h1 className="text-2xl sm:text-3xl font-black text-[#005a82] tracking-tight">
                    Conversor RF
                  </h1>
                  <p className="text-sm text-slate-500 font-medium">
                    Simule conversões de RF e entenda a eficiência e a condição de sinal do seu cabo.
                  </p>
                </div>

                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                  <div className="p-6 sm:p-8">
                    <div className="grid grid-cols-1 md:grid-cols-5 gap-6 items-center">
                      
                      <div className="md:col-span-2 space-y-2">
                        <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider">
                          VSWR (:1)
                        </label>
                        <div className="relative">
                          <input
                            type="number"
                            min="1"
                            step="0.01"
                            value={vswr}
                            onChange={handleVswrChange}
                            className="w-full text-2xl font-black px-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-2 focus:ring-[#005a82] focus:border-[#005a82] transition-all outline-none"
                            placeholder="1.50"
                          />
                          <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-sm">
                            ROE
                          </span>
                        </div>
                      </div>

                      <div className="hidden md:flex justify-center">
                        <div className="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 font-bold">
                          ⇄
                        </div>
                      </div>

                      <div className="md:col-span-2 space-y-2">
                        <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider">
                          Return Loss (dB)
                        </label>
                        <div className="relative">
                          <input
                            type="number"
                            min="0"
                            step="0.1"
                            value={returnLoss}
                            onChange={handleRlChange}
                            className="w-full text-2xl font-black px-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-2 focus:ring-[#005a82] focus:border-[#005a82] transition-all outline-none"
                            placeholder="14.0"
                          />
                          <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-sm">
                            dB
                          </span>
                        </div>
                      </div>

                    </div>

                    <hr className="my-8 border-slate-100" />

                    <div className="overflow-x-auto rounded-xl border border-[#3b6b9e] shadow-sm mb-6">
                      <table className="w-full text-center border-collapse min-w-[500px]">
                        <thead>
                          <tr className="bg-[#4a80ba] text-white">
                            <th className="border-r border-[#3b6b9e] p-2.5 font-bold text-sm sm:text-base">WSWR</th>
                            <th className="border-r border-[#3b6b9e] p-2.5 font-bold text-sm sm:text-base">Return Loss</th>
                            <th className="border-r border-[#3b6b9e] p-2.5 font-bold text-sm sm:text-base">Reflection</th>
                            <th className="border-r border-[#3b6b9e] p-2.5 font-bold text-sm sm:text-base">Mismatch</th>
                            <th className="p-2.5 font-bold text-sm sm:text-base">Match</th>
                          </tr>
                          <tr className="bg-[#3b6b9e] text-white">
                            <th className="border-r border-[#2d537c] py-1 px-2 font-semibold italic text-xs">(:1)</th>
                            <th className="border-r border-[#2d537c] py-1 px-2 font-semibold italic text-xs">(dB)</th>
                            <th className="border-r border-[#2d537c] py-1 px-2 font-semibold italic text-xs">Coefficient</th>
                            <th className="border-r border-[#2d537c] py-1 px-2 font-semibold italic text-xs">Loss (dB)</th>
                            <th className="py-1 px-2 font-semibold italic text-xs">Efficiency (%)</th>
                          </tr>
                        </thead>
                        <tbody className="bg-[#eef4fb]">
                          <tr>
                            <td className="border-r border-[#3b6b9e]/30 p-4 font-mono font-bold text-slate-800 text-xl">{vswr || '-'}</td>
                            <td className="border-r border-[#3b6b9e]/30 p-4 font-mono font-bold text-slate-800 text-xl">{returnLoss || '-'}</td>
                            <td className="border-r border-[#3b6b9e]/30 p-4 font-mono font-bold text-slate-800 text-xl">{gamma || '-'}</td>
                            <td className="border-r border-[#3b6b9e]/30 p-4 font-mono font-bold text-slate-800 text-xl">{mismatchLoss || '-'}</td>
                            <td className="p-4 font-mono font-bold text-[#e31e24] text-xl">{matchEfficiency || '-'}</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>

                    <div className={`p-4 rounded-xl border flex items-center justify-between transition-all ${status.bg} border-transparent`}>
                      <span className="text-xs font-bold text-slate-600 uppercase tracking-wider">
                        Condição de Sinal:
                      </span>
                      <span className={`text-base font-black uppercase tracking-wide ${status.color}`}>
                        {status.text}
                      </span>
                    </div>

                  </div>
                </div>

                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-4">
                  <h2 className="text-slate-800 font-bold text-base">Informações Técnicas</h2>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs text-slate-600">
                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-1">
                      <span className="font-bold text-[#005a82] block mb-1">Cálculo de Reflexão:</span>
                      <p className="font-mono">Γ = (VSWR - 1) / (VSWR + 1)</p>
                      <p className="font-mono">Return Loss = -20 × log₁₀(Γ)</p>
                    </div>
                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-1">
                      <span className="font-bold text-[#e31e24] block mb-1">Cálculo de Eficiência:</span>
                      <p className="font-mono">Mismatch Loss = -10 × log₁₀(1 - Γ²)</p>
                      <p className="font-mono">Efficiency (%) = (1 - Γ²) × 100</p>
                    </div>
                  </div>
                </div>

              </main>

              {/* Footer */}
              <footer className="bg-white border-t border-slate-200 py-6 mt-8">
                <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">
                  <div className="flex items-center gap-3">
                    <img 
                      src={logoUrl} 
                      alt="Datalink" 
                      className="h-7 w-auto object-contain opacity-60"
                    />
                    <span className="text-xs font-medium text-slate-400">
                      | Soluções em Cabeamento Especial
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400 font-medium">
                    © {new Date().getFullYear()} AF Datalink. Todos os direitos reservados.
                  </p>
                </div>
              </footer>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
